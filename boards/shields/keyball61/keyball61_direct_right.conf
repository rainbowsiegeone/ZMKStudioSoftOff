# Поддержка указательных устройств (трекбол) в ZMK
CONFIG_ZMK_POINTING=y
CONFIG_SPI=y

# ZMK Studio: редактирование раскладки по USB без пересборки
CONFIG_ZMK_STUDIO=y
# Без блокировки: для изменений не нужна клавиша разблокировки (&studio_unlock)
CONFIG_ZMK_STUDIO_LOCKING=n

# Драйвер датчика (finn-e/zmk-driver-pmw3389)
CONFIG_INPUT=y
CONFIG_INPUT_PIXART_PMW3360=y

# Мягкое выключение (поведение Soft Off на слое 3). Включение: кнопка Reset на плате.
CONFIG_ZMK_PM_SOFT_OFF=y

# Поддержка указательных устройств (трекбол) в ZMK
CONFIG_ZMK_POINTING=y
CONFIG_SPI=y

# Bluetooth: минимальный интервал и без пропуска соединений
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0

# Драйвер датчика (finn-e/zmk-driver-pmw3389)
CONFIG_INPUT=y
CONFIG_INPUT_PIXART_PMW3360=y

# Мягкое выключение (поведение Soft Off на слое 3). Включение: кнопка Reset на плате.
CONFIG_ZMK_PM_SOFT_OFF=y
